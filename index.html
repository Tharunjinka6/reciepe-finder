<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reciepe finder</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
    <div>
        <div class="header">
            <img class="logo" src="logo 2.jpg" alt="Logo">
            <h1>SoSaute</h1>
        </div>
        <div class="main">
            <input class="searchbox" type="text" placeholder="Search recipes">
            <button class="search">
                <span class="material-symbols-outlined">
                search
                </span>
            </button>
            <button class="bookmark">
                <span class="material-symbols-outlined">
                bookmark
                </span>
            </button>
            <button class="dice">
                <span class="material-symbols-outlined">
                    casino
                </span>
            </button>
            <button class="menu">
                <span class="material-symbols-outlined">
                    layers
                </span>
            </button>
        </div>
    </div>
    <div class="recipes"></div>
    <div class="aboutrecipe"></div>
    <script src="script.js"></script>
</body>
</html>
